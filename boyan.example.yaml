state_dir: ./.state/boyan

# Authority is separate from the disposable state_dir/search projection.
# Existing state_dir/badger files are never imported or removed automatically.
canonical:
  backend: sqlite
  sqlite:
    path: '' # Default: state_dir/canonical/canonical.sqlite
    busy_timeout: 1s
# For PostgreSQL, omit sqlite settings and use:
# canonical:
#   backend: postgres
#   postgres:
#     dsn_env: BOYAN_POSTGRES_DSN
#     connect_timeout: 5s
#     allow_local_insecure: false
# Supply the DSN through that environment secret. Remote connections require
# sslmode=verify-full with trusted roots. Explicit local sslmode=disable also
# requires allow_local_insecure: true. Search remains local SQLite.

log:
  level: info

http:
  listen: 127.0.0.1:8686
  request_timeout: 15s
  shutdown_timeout: 10s
  max_body_bytes: 1048576

derivation:
  provider: memory
  working_dir: .
  timeout: 30s
  max_output_bytes: 262144
  runtime:
    providers:
      memory:
        type: codex_acp
        codex_acp:
          model: memory-fast

# Deprecated compatibility settings; no SQL value-log GC action.
maintenance:
  value_log_gc_interval: 6h
  discard_ratio: 0.5

# Optional; see docs/OPERATIONS.md#embeddings-configuration-and-bounds.
# Disabled values are inert. The overlay overrides these through BOYAN_*.
embeddings:
  enabled: false
  endpoint: http://127.0.0.1:8080/v1/embeddings
  model: intfloat/multilingual-e5-base
  revision: d128750597153bb5987e10b1c3493a34e5a4502a
  dimensions: 768
  query_prefix: 'query: '
  passage_prefix: 'passage: '
  api_key_env: ''
  failure_policy: lexical
