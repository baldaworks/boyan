name: lint

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  arch:
    name: arch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: false
      - name: go-arch-lint
        run: go tool go-arch-lint check --project-path .

  golangci:
    name: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build-tags: ["", "integration"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --build-tags=${{ matrix.build-tags }}
