name: test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
      - name: Guard Boyan independence
        run: |
          if go list -deps ./... | grep -Fx 'github.com/normahq/balda'; then
            echo "unexpected github.com/normahq/balda dependency detected" >&2
            exit 1
          fi
      - name: Test
        run: go test -v -race ./...
