name: test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
      - name: Unit tests
        run: go test ./...
      - name: Unit race tests
        run: go test -race ./...

  integration:
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'release' && github.event.action == 'published')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
        env:
          POSTGRES_USER: boyan_test
          POSTGRES_PASSWORD: boyan_test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U boyan_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      GOMAXPROCS: "4"
      BOYAN_REQUIRE_POSTGRES: "1"
      BOYAN_TEST_POSTGRES_DSN: postgres://boyan_test:boyan_test@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
      - name: Integration tests
        run: go test -count=1 -json -tags=integration -timeout=30m -p=1 ./...
      - name: Full integration race tests
        run: go test -count=1 -json -race -tags=integration -timeout=30m -p=1 ./...
