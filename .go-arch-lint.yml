version: 3
workdir: .

# This file enforces layer boundaries only. Audience-facing usage surfaces are
# documented in ARCHITECTURE.md and may span multiple components here.

allow:
  depOnAnyVendor: false
  deepScan: false

excludeFiles:
  - "^.*_test\\.go$"

components:
  public_contracts:
    in:
      - pkg/memory
      - client/http
      - boyantest

  memory_engine:
    in:
      - internal/canonicalcore
      - internal/boundarycore
      - internal/ingestapp
      - internal/portableapp
      - internal/memoryread
      - internal/memoryops
      - internal/orderedingest
      - internal/scopelanes
      - internal/projection
      - internal/projectionsync
      - internal/structuredderive

  infrastructure:
    in:
      - internal/canonicalops
      - internal/forgetops
      - internal/derivation
      - store/badger
      - index/bleve

  standalone_shell:
    in:
      - pkg/boyan
      - internal/standalonecfg
      - internal/httpingest
      - internal/standaloneruntime
      - mcp
      - cmd/boyan

deps:
  public_contracts:
    mayDependOn:
      - public_contracts
    anyVendorDeps: false

  memory_engine:
    mayDependOn:
      - public_contracts
      - memory_engine
    anyVendorDeps: false

  infrastructure:
    mayDependOn:
      - public_contracts
      - memory_engine
      - infrastructure
    anyVendorDeps: true

  standalone_shell:
    mayDependOn:
      - public_contracts
      - memory_engine
      - infrastructure
      - standalone_shell
    anyVendorDeps: true
