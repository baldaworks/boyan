version: 3
workdir: .

# This file enforces layer boundaries only. Audience-facing usage surfaces are
# documented in ARCHITECTURE.md and may span multiple components here.

allow:
  depOnAnyVendor: false
  deepScan: false

excludeFiles:
  - "^.*_test\\.go$"

components:
  public_contracts:
    in:
      - pkg/memory
      - client/http
      - boyantest
      - store/archive

  memory_engine:
    in:
      - internal/canonicalcore
      - internal/boundarycore
      - internal/ingestapp
      - internal/portableapp
      - internal/memoryread
      - internal/memoryops
      - internal/orderedingest
      - internal/scopelanes
      - internal/projection
      - internal/projectionsync
      - internal/structuredderive

  semantic_core:
    in:
      - internal/semantic

  canonical_sql:
    in:
      - internal/canonicalsql

  infrastructure:
    in:
      - internal/canonicalops
      - internal/forgetops
      - internal/derivation
      - internal/embedding
      - internal/semanticprojection
      - internal/canonicalsqltest
      - internal/canonicalsqltest/storefixture
      - store/badger
      - store/sqlite
      - store/postgres
      - index/sqlite

  standalone_shell:
    in:
      - pkg/boyan
      - internal/standalonecfg
      - internal/httpingest
      - internal/standaloneruntime
      - mcp
      - cmd/boyan

deps:
  public_contracts:
    mayDependOn:
      - public_contracts
    anyVendorDeps: false

  memory_engine:
    mayDependOn:
      - public_contracts
      - memory_engine
      - semantic_core
    anyVendorDeps: false

  semantic_core:
    mayDependOn:
      - public_contracts
      - semantic_core
    anyVendorDeps: true

  canonical_sql:
    mayDependOn:
      - public_contracts
    anyVendorDeps: true

  infrastructure:
    mayDependOn:
      - public_contracts
      - canonical_sql
      - memory_engine
      - semantic_core
      - infrastructure
    anyVendorDeps: true

  standalone_shell:
    mayDependOn:
      - public_contracts
      - memory_engine
      - semantic_core
      - infrastructure
      - standalone_shell
    anyVendorDeps: true
